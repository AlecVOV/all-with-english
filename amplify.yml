# Monorepo build spec for AWS Amplify Hosting.
# Each Amplify app picks its entry below through the app-level env var
# AMPLIFY_MONOREPO_APP_ROOT (must equal the appRoot value exactly).
# Commands run inside that appRoot folder.
version: 1
applications:
  # Nuxt 4 SPA (static) + Amplify Gen 2 backend (Cognito guest, AppSync, DynamoDB)
  - appRoot: word-rain
    backend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
        build:
          commands:
            - npm ci --cache .npm --prefer-offline
            # Deploys/updates the backend stack of this app+branch and writes
            # amplify_outputs.json, which the frontend build imports.
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
        build:
          commands:
            - npm run generate
      artifacts:
        baseDirectory: .output/public
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*

  # Vite static site, no backend
  - appRoot: reading-iellts
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
